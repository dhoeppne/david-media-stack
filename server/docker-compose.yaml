services:
  sonarr:
    container_name: media_sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - "8989:8989"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIGROOT}/sonarr:/config
      - nas-data:/data
    labels:
      - "arcane.stack.auto-update=true"

  radarr:
    container_name: media_radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - "7878:7878"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIGROOT}/radarr:/config
      - nas-data:/data
    labels:
      - "arcane.stack.auto-update=true"

  prowlarr:
    container_name: media_prowlarr
    image: lscr.io/linuxserver/prowlarr:develop
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - "9696:9696"
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
    volumes:
      - ${CONFIGROOT}/prowlarr:/config
    labels:
      - "arcane.stack.auto-update=true"

  seerr:
    container_name: media_seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    networks:
      - mediastack
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIGROOT}/overseer:/app/config
    restart: unless-stopped
    labels:
      - "arcane.stack.auto-update=true"

  reclaimerr:
    container_name: media_reclaimerr
    networks:
      - mediastack
    image: ghcr.io/jessielw/reclaimerr:latest
    restart: unless-stopped
    volumes:
      - ${CONFIGROOT}/reclaimerr:/app/data
    ports:
      - "8249:8000"
    labels:
      - "arcane.stack.auto-update=true"

  rangarr:
    image: judochinx/rangarr:latest
    container_name: media_rangarr
    hostname: rangarr
    restart: unless-stopped
    ports:
      - "6767:7878"
    environment:
      TZ: ${TZ}
      LOG_LEVEL: INFO
    volumes:
      - ${CONFIGROOT}/rangarr/config.yaml:/app/config/config.yaml:ro
    networks:
      - mediastack
    labels:
      - "arcane.stack.auto-update=true"

  killarr:
    image: judochinx/killarr:latest
    container_name: media_killarr
    restart: unless-stopped
    volumes:
      # Mount the same config.yaml you use for rangarr (or a dedicated one)
      - ${CONFIGROOT}/rangarr/config.yaml:/app/config/config.yaml:ro
    environment:
      - LOG_LEVEL=INFO
    networks:
      - mediastack

  cinerr:
    image: alexkouzel/cinerr:latest
    container_name: media_cinerr
    ports:
      - "8080:8080"
    volumes:
      - nas-data-media:/media:ro
      - ${CONFIGROOT}/cinerr:/data
    restart: unless-stopped
    networks:
      - mediastack
    labels:
      - "arcane.stack.auto-update=true"

  # ---------------------------------------------------------------------
  # Tdarr Server + WebUI. No internal node — both transcode pools below
  # are separate node containers so the server stays light and dedicated.
  # ---------------------------------------------------------------------
  tdarr-server:
    image: ghcr.io/haveagitgat/tdarr:latest
    container_name: tdarr-server
    restart: unless-stopped
    networks:
      - tdarr-net
    ports:
      - "8265:8265" # WebUI
      - "8266:8266" # Server <-> Node comms
    environment:
      - TZ=America/Vancouver
      - PUID=1000 # match your Hyperion docker user — adjust if different
      - PGID=1000
      - UMASK_SET=002
      - serverIP=0.0.0.0
      - serverPort=8266
      - webUIPort=8265
      - internalNode=false
      - ffmpegVersion=7
      - auth=false # consider true + Authentik forward-auth on the NPM proxy host instead
    volumes:
      - ${CONFIGROOT}/tdarr/server:/app/server
      - ${CONFIGROOT}/tdarr/configs:/app/configs
      - ${CONFIGROOT}/tdarr/logs:/app/logs
      # Media must be mounted at the SAME container path on server + both
      # nodes, since the server stores paths and nodes resolve them locally.
      - nas-data:/media
      - /mnt/hyperion_share_fast/tdarr/transcode_cache:/temp

  # ---------------------------------------------------------------------
  # Always-on CPU pool. Software x265, 8 concurrent transcode workers.
  # Runs 24/7 — this is your steady-state throughput.
  # ---------------------------------------------------------------------
  tdarr-node-cpu:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node-cpu
    restart: unless-stopped
    networks:
      - tdarr-net
    environment:
      - TZ=America/Vancouver
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - nodeName=hyperion-cpu
      - serverIP=tdarr-server # resolves via Docker's embedded DNS if on same custom network — see note below
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7
    volumes:
      - ${CONFIGROOT}/tdarr/configs:/app/configs
      - ${CONFIGROOT}/tdarr/logs:/app/logs
      - nas-data:/media
      - /mnt/hyperion_share_fast/tdarr/transcode_cache:/temp
    depends_on:
      - tdarr-server

  # ---------------------------------------------------------------------
  # GPU pool. QSV hardware x265 via the Arc A380. Container runs all the
  # time (cheap when idle), but you cap its worker count to 0 outside
  # 2am-6am using Tdarr's own scheduler in the WebUI — see setup notes.
  # ---------------------------------------------------------------------
  tdarr-node-gpu:
    image: ghcr.io/haveagitgat/tdarr_node:latest
    container_name: tdarr-node-gpu
    restart: unless-stopped
    networks:
      - tdarr-net
    environment:
      - TZ=America/Vancouver
      - PUID=1000
      - PGID=1000
      - UMASK_SET=002
      - nodeName=hyperion-gpu
      - serverIP=tdarr-server
      - serverPort=8266
      - inContainer=true
      - ffmpegVersion=7
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ${CONFIGROOT}/tdarr/configs:/app/configs
      - ${CONFIGROOT}/tdarr/logs:/app/logs
      - nas-data:/media
      - /mnt/hyperion_share_fast/tdarr/transcode_cache:/temp
    depends_on:
      - tdarr-server

volumes:
  nas-data:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_IP},rw,nolock,soft,intr,timeo=300"
      device: ":${NAS_NFS_PATH}"
  nas-data-media:
    driver: local
    driver_opts:
      type: "nfs"
      o: "addr=${NAS_IP},ro,nolock,soft,intr,timeo=300"
      device: ":${NAS_NFS_PATH}/media"

networks:
  mediastack:
  tdarr-net:
