# a comment
services:
  vpn:
    container_name: media_vpn
    image: qmcgaw/gluetun:latest
    networks:
      - mediastack
    cap_add:
      - NET_ADMIN # required to modify network interfaces
    volumes:
      - ${CONFIGROOT}/config/vpn:/gluetun
    ports:
      - 1080:1080 # qbittorrent webui
      - 6881:6881 # qbittorrent download
      - 6881:6881/udp
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - TZ=${TZ} # timezone, defined in .env
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - VPN_SERVICE_PROVIDER=mullvad # mullvad is cheap, private, and uses wireguard (fast)
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_KEY}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESS}
      - SERVER_CITIES=${SERVER_CITIES}

  qbittorrent:
    container_name: media_qbittorrent
    depends_on:
      - vpn
    image: linuxserver/qbittorrent:latest
    restart: unless-stopped
    network_mode: service:vpn # run on the vpn network
    environment:
      - TZ=${TZ} # timezone, defined in .env
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - WEBUI_PORT=1080 # to stop it from conflicting with stuff
    volumes:
      - ${CONFIGROOT}/config/qbittorrent:/config # config files
      - ${DATAROOT}/downloads:/downloads # downloads folder

  reclaimerr:
    container_name: media_reclaimerr
    networks:
      - mediastack
    image: ghcr.io/jessielw/reclaimerr:latest
    restart: unless-stopped
    volumes:
      - ${CONFIGROOT}/config/reclaimerr:/app/data
    ports:
      - "8249:8000"

  rangarr:
    image: judochinx/rangarr:latest
    container_name: media_rangarr
    hostname: rangarr
    restart: unless-stopped
    environment:
      TZ: TZ=${TZ} # Set your timezone for log timestamps (e.g. America/New_York). Full list: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
      LOG_LEVEL: INFO # Use DEBUG for verbose logging
    volumes:
      - ${CONFIGROOT}/config/rangarr/config.yaml:/app/config/config.yaml:ro
    networks:
      - mediastack

  cinerr:
    image: alexkouzel/cinerr:latest
    container_name: media_cinerr
    ports:
      - "8080:8080"
    volumes:
      - ${DATAROOT}:/media:ro
      - ${CONFIGROOT}/config/cinerr:/data
    restart: unless-stopped
    networks:
      - mediastack

  prowlarr:
    container_name: media_prowlarr # prowlarr is neat, lets you point sonarr and radarr to it for easy indexers
    image: lscr.io/linuxserver/prowlarr:develop
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - "9696:9696"
    environment:
      - TZ=${TZ}
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
      - UMASK=002
    volumes:
      - ${CONFIGROOT}/config/prowlarr:/config

  # uncomment this section if you want to run Plex as part of this stack
  # I run mine on a separate server, and so don't use it here.
  # plex-server:
  #   container_name: media_plex-server
  #   image: lscr.io/linuxserver/plex:latest
  #   restart: unless-stopped
  #   ports:
  #     - "32400:32400"
  #   environment:
  #     - TZ=${TZ} # timezone, defined in .env
  #     - PUID=${PUID} # default user id, defined in .env
  #     - PGID=${PGID} # default group id, defined in .env
  #     - PLEX_CLAIM=${PLEX_CLAIM}
  #     - VERSION=docker
  #   volumes:
  #     - ${CONFIGROOT}/config/plex/db:/config # plex database
  #     - ${CONFIGROOT}/config/plex/transcode:/transcode # temp transcoded files
  #     - ${DATAROOT}/complete/tv:/tv # media library
  #     - ${DATAROOT}/complete/movies:/movies

  sonarr:
    container_name: media_sonarr
    image: linuxserver/sonarr:latest
    restart: unless-stopped
    networks:
      - mediastack
    ports:
      - "8989:8989"
    environment:
      - TZ=${TZ} # timezone, defined in .env
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIGROOT}/config/sonarr:/config # config files
      - ${DATAROOT}/complete/tv:/tv # tv shows folder
      - ${DATAROOT}/downloads:/downloads # download folder

  radarr:
    container_name: media_radarr
    image: linuxserver/radarr:latest
    restart: unless-stopped
    ports:
      - "7878:7878"
    networks:
      - mediastack
    environment:
      - TZ=${TZ} # timezone, defined in .env
      - PUID=${PUID} # default user id, defined in .env
      - PGID=${PGID} # default group id, defined in .env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${CONFIGROOT}/config/radarr:/config # config files
      - ${DATAROOT}/complete/movies:/movies # movies folder
      - ${DATAROOT}/downloads:/downloads # download folder

  seerr: # this is request.davidhoeppner.ca
    container_name: media_seerr
    image: sctx/seerr:latest
    init: true
    networks:
      - mediastack
      - wanfacing
    environment:
      - LOG_LEVEL=info
      - TZ=${TZ}
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/settings/public || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    ports:
      - "5055:5055"
    volumes:
      - ${CONFIGROOT}/config/overseer:/app/config
    restart: unless-stopped

networks:
  mediastack:
  wanfacing:
    external: true
